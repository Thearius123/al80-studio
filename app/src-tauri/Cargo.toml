[package]
name = "al80-studio-app"
version = "0.3.0-alpha"
description = "Advanced open-source control software for the YUNZII AL80"
edition = "2024"

[lib]
name = "al80_studio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
al80-core = { path = "../../core" }
